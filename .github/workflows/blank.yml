                </button>

                <!-- Mobile Menu Button -->
                <button onclick="toggleMobileMenu()" class="md:hidden p-2.5 rounded-xl bg-navy-800/80 hover:bg-navy-700 text-gray-300 hover:text-white transition-all border border-gray-700/50">
                    <i class="fa-solid fa-bars" id="mobile-menu-icon"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Navigation Menu -->
        <div id="mobile-menu" class="hidden md:hidden glass-panel border-b border-gray-800 px-4 pt-2 pb-4 space-y-2">
            <button onclick="showSection('home'); toggleMobileMenu();" class="block w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium text-gray-300 hover:bg-navy-800">Home</button>
            <button onclick="showSection('directory'); toggleMobileMenu();" class="block w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium text-gray-300 hover:bg-navy-800">All Problems</button>
            <button onclick="showSection('tools'); toggleMobileMenu();
