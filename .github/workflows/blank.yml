                <button onclick="showSection('directory')" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-navy-800 transition-colors" data-target="directory">All Problems</button>
                <button onclick="showSection('tools')" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-navy-800 transition-colors" data-target="tools">AI Tools & Resources</button>
                <button onclick="showSection('guides')" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-navy-800 transition-colors" data-target="guides">Beginner Guides</button>
                <button onclick="showSection('about')" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-navy-800 transition-colors" data-target="about">About</button>
            </nav>

            <!-- Right Actions -->
            <div class="flex items-center space-x-3">
